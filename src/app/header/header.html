
<header class="header w-100">
  <nav class="navbar navbar-expand-lg navbar-dark bg-gradient-primary shadow-sm w-100">
    <div class="container-fluid">
      
      <a class="navbar-brand d-flex align-items-center ml-3" routerLink="/">
        <div class="brand-icon mr-2">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <span class="brand-text">
          <strong>Angular</strong>Blog
        </span>
      </a>

    
      <button class="navbar-toggler mr-3" type="button" data-toggle="collapse" data-target="#navbarContent" 
              aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

    
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/home" routerLinkActive="active">
              <i class="fas fa-home mr-1"></i>Home
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="categoriesDropdown" 
               role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              <i class="fas fa-th-large mr-1"></i>Categories
            </a>
            <div class="dropdown-menu" aria-labelledby="categoriesDropdown">
              <a class="dropdown-item" routerLink="/category/web-development">
                <span class="mr-2">🌐</span>Web Development
              </a>
              <a class="dropdown-item" routerLink="/category/angular">
                <span class="mr-2">🅰️</span>Angular
              </a>
              <a class="dropdown-item" routerLink="/category/javascript">
                <span class="mr-2">💛</span>JavaScript
              </a>
              <a class="dropdown-item" routerLink="/category/typescript">
                <span class="mr-2">🔷</span>TypeScript
              </a>
              <a class="dropdown-item" routerLink="/category/frontend">
                <span class="mr-2">🎨</span>Frontend Development
              </a>
              <a class="dropdown-item" routerLink="/category/backend">
                <span class="mr-2">⚙️</span>Backend Development
              </a>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item" routerLink="/categories">
                <i class="fas fa-list mr-2"></i>All Categories
              </a>
            </div>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/add-post" routerLinkActive="active">
              <i class="fas fa-plus-circle mr-1"></i>New Post
            </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" routerLink="/about" routerLinkActive="active">
              <i class="fas fa-info-circle mr-1"></i>About
            </a>
          </li>
        </ul>


        
        <div class="navbar-nav mr-3">
          <ng-container *ngIf="!isLoggedIn; else userMenu">
            <button class="btn btn-outline-light btn-sm mr-2" data-toggle="modal" data-target="#authModal"
                    (click)="openLogin()">
              <i class="fas fa-sign-in-alt mr-1"></i>Login
            </button>
            <button class="btn btn-light btn-sm" data-toggle="modal" data-target="#authModal"
                    (click)="openSignup()">
              <i class="fas fa-user-plus mr-1"></i>Sign Up
            </button>
          </ng-container>
          
          <ng-template #userMenu>
            <div class="nav-item dropdown">
              <a class="nav-link dropdown-toggle text-white" href="#" id="userDropdown" 
                 role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <i class="fas fa-user-circle mr-1"></i>
                {{ currentUser?.name }}
              </a>
              <div class="dropdown-menu dropdown-menu-right" aria-labelledby="userDropdown">
                <a class="dropdown-item" href="#">
                  <i class="fas fa-user mr-2"></i>Profile
                </a>
                <a class="dropdown-item" href="#">
                  <i class="fas fa-edit mr-2"></i>My Posts
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" (click)="logout(); $event.preventDefault()">
                  <i class="fas fa-sign-out-alt mr-2"></i>Logout
                </a>
              </div>
            </div>
          </ng-template>
        </div>
      </div>
    </div>
  </nav>
</header>


<app-auth-modal #authModal (authSuccess)="onAuthSuccess()"></app-auth-modal>
