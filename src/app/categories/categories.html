 <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="display-4 font-weight-bold">All Categories</h1>
        <p class="lead text-muted">Explore all our blog categories</p>
      </div>
      
      <div class="row">
        <div class="col-lg-4 col-md-6 mb-4" *ngFor="let category of categoryService.getCategories()">
          <a [routerLink]="['/category', category.id]" class="card text-decoration-none h-100 category-card">
            <div class="card-body text-center p-4">
              <div class="category-icon display-4 mb-3" [style.color]="category.color">
                {{ category.icon }}
              </div>
              <h3 class="card-title">{{ category.name }}</h3>
              <p class="card-text text-muted">{{ category.description }}</p>
              <span class="badge badge-primary">{{ category.posts.length }} posts</span>
            </div>
          </a>
        </div>
      </div>
    </div>
