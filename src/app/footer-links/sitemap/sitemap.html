 <div class="container py-5">
      <h1 class="display-4 font-weight-bold mb-4">Sitemap</h1>
      
      <div class="row">
        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-header bg-primary text-white">
              <h5 class="mb-0">Main Pages</h5>
            </div>
            <div class="card-body">
              <ul class="list-unstyled">
                <li><a routerLink="/home" class="text-decoration-none">Home</a></li>
                <li><a routerLink="/about" class="text-decoration-none">About</a></li>
                <li><a routerLink="/add-post" class="text-decoration-none">Write a Post</a></li>
                <li><a routerLink="/popular" class="text-decoration-none">Popular Posts</a></li>
              </ul>
            </div>
          </div>
        </div>
        
        <div class="col-md-6 mb-4">
          <div class="card">
            <div class="card-header bg-success text-white">
              <h5 class="mb-0">Categories</h5>
            </div>
            <div class="card-body">
              <ul class="list-unstyled">
                <li *ngFor="let category of categoryService.getCategories()">
                  <a [routerLink]="['/category', category.id]" class="text-decoration-none">
                    {{ category.name }}
                  </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
